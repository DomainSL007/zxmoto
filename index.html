<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZXMOTO.MA — FOR SALE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange:   #FF6B00;      /* ZXMOTO primary — throttle orange */
    --orange2:  #E05A00;      /* darker orange for hover */
    --red:      #C0392B;      /* ZXMOTO secondary — brake red */
    --bg:       #0F0F0F;      /* near-black asphalt */
    --surface:  #181818;      /* dark carbon card */
    --surface2: #1F1F1F;      /* input bg */
    --border:   #2C2C2C;      /* subtle border */
    --text:     #B0ADA8;      /* warm grey text */
    --bright:   #F5F5F0;      /* off-white heading */
    --muted:    #4A4845;      /* dimmed text */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  body[dir="rtl"] { font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* Carbon-weave texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 8px
      ),
      repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 8px
      );
    pointer-events: none;
    z-index: 0;
  }
  /* Orange speed-streak glow top-left, red ember glow bottom-right */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 45% at 0% 0%,   rgba(255,107,0,0.09) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 100% 100%, rgba(192,57,43,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Lang switcher (top bar) ── */
  .lang-bar {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 100;
    display: flex;
    gap: 6px;
  }
  body[dir="rtl"] .lang-bar { right: auto; left: 14px; }
  .lang-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 5px 10px;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Barlow Condensed', sans-serif;
    text-transform: uppercase;
    clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
  }
  .lang-pill:hover, .lang-pill.active {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(255,107,0,0.07);
  }

  /* ── Main layout ── */
  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }

  .ornament {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown 0.6s ease both;
  }
  .ornament-line {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--orange);
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    opacity: 0.9;
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    width: 44px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    opacity: 0.35;
  }

  .badge {
    display: inline-block;
    background: var(--orange);
    color: #0F0F0F;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 4px 16px;
    border-radius: 1px;
    margin-bottom: 20px;
    animation: fadeDown 0.6s 0.1s ease both;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 52px 48px;
    text-align: center;
    animation: fadeUp 0.7s 0.2s ease both;
    position: relative;
    box-shadow: 0 0 80px rgba(255,107,0,0.05), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  /* Diagonal speed-slash corners */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--orange), var(--red), transparent 70%);
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 40%; height: 2px;
    background: linear-gradient(270deg, var(--orange), transparent);
    opacity: 0.4;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 20px;
    color: var(--bright);
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(255,107,0,0.15);
  }
  .tld { color: var(--orange); }

  .divider {
    width: 48px; height: 2px;
    background: linear-gradient(90deg, var(--orange), var(--red));
    margin: 0 auto 20px;
    opacity: 0.7;
  }

  .desc {
    color: var(--text);
    font-size: 15px;
    line-height: 1.75;
    max-width: 420px;
    margin: 0 auto 28px;
    font-weight: 400;
  }

  .price-block {
    margin: 28px 0;
    padding: 20px;
    border: 1px solid rgba(255,107,0,0.2);
    border-left: 3px solid var(--orange);
    border-radius: 2px;
    background: rgba(255,107,0,0.04);
    position: relative;
  }
  .price-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .price {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2.1rem;
    color: var(--orange);
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 24px rgba(255,107,0,0.25);
  }

  .form { margin-top: 32px; text-align: left; }
  body[dir="rtl"] .form { text-align: right; }

  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 6px;
    font-weight: 600;
    opacity: 0.85;
  }
  .form-row input,
  .form-row textarea {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--border);
    border-radius: 2px;
    color: var(--bright);
    font-size: 14px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    direction: inherit;
  }
  .form-row input:focus,
  .form-row textarea:focus {
    border-color: var(--border);
    border-bottom-color: var(--orange);
    box-shadow: 0 4px 12px rgba(255,107,0,0.08);
  }
  .form-row textarea { resize: vertical; min-height: 80px; }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    color: #0F0F0F;
    border: none;
    border-radius: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.18s, box-shadow 0.18s, transform 0.15s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    box-shadow: 0 4px 24px rgba(255,107,0,0.25);
  }
  .btn:hover {
    background: var(--orange2);
    box-shadow: 0 4px 36px rgba(255,107,0,0.4);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }

  .contact {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .contact a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color 0.2s;
    letter-spacing: 0.5px;
  }
  .contact a:hover { color: var(--orange); }

  .wa-icon {
    width: 18px; height: 18px;
    fill: #25D366;
    flex-shrink: 0;
  }
  .mail-icon { font-size: 16px; }

  .success {
    display: none;
    text-align: center;
    padding: 24px;
    color: var(--orange);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 600;
    text-transform: uppercase;
  }

  /* Rev-up pulse on h1 */
  @keyframes revpulse {
    0%,100% { text-shadow: 0 0 40px rgba(255,107,0,0.15); }
    50%      { text-shadow: 0 0 60px rgba(255,107,0,0.35), 0 0 100px rgba(192,57,43,0.15); }
  }
  h1 { animation: revpulse 3s ease-in-out infinite; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:translateY(0); } }

  @media (max-width: 520px) {
    .card { padding: 36px 24px; }
    .contact { gap: 16px; }
  }
</style>
</head>
<body>

        <!-- WhatsApp SVG icon -->

          <path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.473 2.027 7.774L0 32l8.467-2.001A15.93 15.93 0 0 0 16 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 0 1-6.758-1.845l-.484-.287-5.025 1.187 1.21-4.898-.316-.503A13.237 13.237 0 0 1 2.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.27-9.846c-.398-.199-2.354-1.162-2.719-1.295-.365-.133-.631-.199-.897.199-.266.398-1.03 1.295-1.263 1.561-.232.266-.465.299-.863.1-.398-.199-1.681-.619-3.203-1.977-1.184-1.056-1.983-2.361-2.215-2.759-.232-.398-.025-.613.174-.811.179-.178.398-.465.598-.698.199-.232.266-.398.398-.664.133-.266.066-.498-.033-.697-.1-.199-.897-2.161-1.23-2.96-.324-.776-.653-.671-.897-.683l-.764-.013c-.266 0-.697.1-.1063.498-.365.398-1.395 1.362-1.395 3.323s1.428 3.854 1.627 4.12c.199.266 2.808 4.286 6.803 5.998.951.41 1.693.655 2.271.839.954.304 1.823.261 2.51.158.766-.114 2.354-.962 2.687-1.893.333-.93.333-1.727.232-1.893-.099-.166-.365-.265-.763-.464z"/>

<script>
const i18n = {
  en: {
    tagline:   "Contact Us — Buy This Domain Today",
    badge:     "For Sale",
    desc:      "We sell domains with fast response and outstanding service — open to businesses of all sizes and types. Same-day transfer guaranteed. We're open to negotiations.",
    priceLabel:"Asking Price",
    fieldName: "Your Name",
    fieldEmail:"Email Address",
    fieldPhone:"Phone Number",
    fieldOffer:"Your Offer (optional)",
    fieldMsg:  "Message (optional)",
    phName:    "Ahmed Benali",
    phEmail:   "ahmed@company.ma",
    phPhone:   "+212 6XX XXX XXX",
    phOffer:   "e.g. USD 8,000",
    phMsg:     "Tell us about your project...",
    submitBtn: "Submit Offer →",
    successMsg:"✓ Your offer has been received. We'll be in touch shortly.",
    dir:       "ltr"
  },
  fr: {
    tagline:   "Contactez-nous — Achetez ce domaine aujourd'hui",
    badge:     "À Vendre",
    desc:      "Nous vendons des domaines avec une réponse rapide et un service exceptionnel — ouverts aux entreprises de toutes tailles. Transfert le jour même garanti. Nous sommes ouverts à la négociation.",
    priceLabel:"Prix demandé",
    fieldName: "Votre nom",
    fieldEmail:"Adresse e-mail",
    fieldPhone:"Numéro de téléphone",
    fieldOffer:"Votre offre (optionnel)",
    fieldMsg:  "Message (optionnel)",
    phName:    "Ahmed Benali",
    phEmail:   "ahmed@entreprise.ma",
    phPhone:   "+212 6XX XXX XXX",
    phOffer:   "ex. EUR 8 000",
    phMsg:     "Parlez-nous de votre projet...",
    submitBtn: "Soumettre une offre →",
    successMsg:"✓ Votre offre a été reçue. Nous vous contacterons bientôt.",
    dir:       "ltr"
  },
  ar: {
    tagline:   "تواصل معنا — اشترِ هذا النطاق اليوم",
    badge:     "للبيع",
    desc:      "نبيع النطاقات باستجابة سريعة وخدمة متميزة — مفتوحون للشركات من جميع الأحجام والأنواع. نضمن نقل الملكية في نفس اليوم. ونرحب بالتفاوض.",
    priceLabel:"السعر المطلوب",
    fieldName: "الاسم الكامل",
    fieldEmail:"البريد الإلكتروني",
    fieldPhone:"رقم الهاتف",
    fieldOffer:"عرضك (اختياري)",
    fieldMsg:  "رسالة (اختياري)",
    phName:    "أحمد بنعلي",
    phEmail:   "ahmed@company.ma",
    phPhone:   "212 6XX XXX XXX+",
    phOffer:   "مثال: 8,000 درهم",
    phMsg:     "أخبرنا عن مشروعك...",
    submitBtn: "إرسال العرض ←",
    successMsg:"✓ تم استلام عرضك. سنتواصل معك قريباً.",
    dir:       "rtl"
  },
  es: {
    tagline:   "Contáctenos — Compre este dominio hoy",
    badge:     "En Venta",
    desc:      "Vendemos dominios con respuesta rápida y un servicio excelente — abiertos a empresas de todos los tamaños y tipos. Transferencia el mismo día garantizada. Estamos abiertos a negociar.",
    priceLabel:"Precio pedido",
    fieldName: "Su nombre",
    fieldEmail:"Correo electrónico",
    fieldPhone:"Número de teléfono",
    fieldOffer:"Su oferta (opcional)",
    fieldMsg:  "Mensaje (opcional)",
    phName:    "Ahmed Benali",
    phEmail:   "ahmed@empresa.ma",
    phPhone:   "+212 6XX XXX XXX",
    phOffer:   "ej. EUR 8.000",
    phMsg:     "Cuéntenos sobre su proyecto...",
    submitBtn: "Enviar oferta →",
    successMsg:"✓ Su oferta ha sido recibida. Nos pondremos en contacto pronto.",
    dir:       "ltr"
  }
};

function setLang(code) {
  const t = i18n[code];
  const html = document.documentElement;

  // Direction & lang attr
  html.lang = code;
  html.dir  = t.dir;
  document.body.dir = t.dir;

  // Translate all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // Translate placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  // Update active pill
  document.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById('pill-' + code);
  if (pill) pill.classList.add('active');

  localStorage.setItem('preferredLang', code);
}

function detectLang() {
  // 1. Respect a previously saved manual choice
  const saved = localStorage.getItem('preferredLang');
  if (saved && i18n[saved]) return saved;

  // 2. Walk browser language preferences and pick the first match
  const langs = navigator.languages || [navigator.language || 'en'];
  for (const l of langs) {
    const code = l.split('-')[0].toLowerCase(); // e.g. "fr-FR" → "fr"
    if (i18n[code]) return code;
  }

  // 3. Default to English
  return 'en';
}

window.addEventListener('DOMContentLoaded', () => {
  setLang(detectLang());
});

// Form submission
const form = document.getElementById('offerForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('.btn');
  const origText = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      form.reset();
      document.getElementById('successMsg').style.display = 'block';
      btn.style.display = 'none';
    } else {
      btn.textContent = origText;
      btn.disabled = false;
    }
  } catch {
    btn.textContent = origText;
    btn.disabled = false;
  }
});
</script>
