<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZXMOTO.MA — FOR SALE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #9FEF00;
    --green2:  #7EC800;
    --bg:      #141D2B;
    --surface: #1A2332;
    --surface2:#1E2A3A;
    --border:  #2B3A4E;
    --text:    #A4B1CD;
    --bright:  #FFFFFF;
    --muted:   #4A5568;
    --accent:  #FF6B35;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%; /* prevent iOS font inflation */
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh; /* dynamic viewport on mobile browsers */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 16px 24px; /* top padding clears fixed lang-bar */
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent; /* remove tap flash on iOS */
  }

  body[dir="rtl"] { font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* HTB-style grid/scan background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(159,239,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(159,239,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 5%,  rgba(159,239,0,0.06) 0%, transparent 55%),
      radial-gradient(ellipse 50% 70% at 85% 95%, rgba(255,107,53,0.05) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Lang switcher (top bar) ── */
  .lang-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: calc(100vw - 24px);
  }
  body[dir="rtl"] .lang-bar { right: auto; left: 12px; }

  .lang-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 0;
    width: 44px;         /* minimum touch target */
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Share Tech Mono', monospace;
    touch-action: manipulation;
  }
  .lang-pill:hover, .lang-pill.active {
    border-color: var(--green);
    color: var(--green);
    background: rgba(159,239,0,0.06);
  }

  /* ── Main layout ── */
  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }

  .ornament {
    text-align: center;
    margin-bottom: 24px;
    animation: fadeDown 0.6s ease both;
    padding: 0 8px;
  }
  .ornament-line {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--green);
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0.8;
    text-align: center;
    word-break: break-word;
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    width: 28px; height: 1px;
    flex-shrink: 0;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.4;
  }

  .badge {
    display: inline-block;
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 2px;
    margin-bottom: 18px;
    animation: fadeDown 0.6s 0.1s ease both;
    box-shadow: 0 0 12px rgba(159,239,0,0.15);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 32px;
    text-align: center;
    animation: fadeUp 0.7s 0.2s ease both;
    position: relative;
    box-shadow: 0 0 60px rgba(159,239,0,0.04), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  /* HTB bracket corners */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--green);
    border-style: solid;
    opacity: 0.5;
  }
  .card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .card::after  { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

  h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1.7rem, 8vw, 3rem);
    font-weight: 400;
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 18px;
    color: var(--bright);
    text-shadow: 0 0 30px rgba(159,239,0,0.2);
    word-break: break-all; /* prevent overflow on tiny screens */
  }
  .tld { color: var(--green); }

  .divider {
    width: 40px; height: 1px;
    background: var(--green);
    margin: 0 auto 18px;
    opacity: 0.4;
    box-shadow: 0 0 8px var(--green);
  }

  .desc {
    color: var(--text);
    font-size: 15px;
    line-height: 1.75;
    max-width: 420px;
    margin: 0 auto 24px;
    font-weight: 400;
  }

  .price-block {
    margin: 24px 0;
    padding: 18px 16px;
    border: 1px solid rgba(159,239,0,0.2);
    border-radius: 3px;
    background: rgba(159,239,0,0.03);
    position: relative;
  }
  .price-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .price {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    color: var(--green);
    font-weight: 400;
    text-shadow: 0 0 20px rgba(159,239,0,0.3);
    word-break: break-word;
  }

  .form { margin-top: 28px; text-align: left; }
  body[dir="rtl"] .form { text-align: right; }

  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 6px;
    opacity: 0.8;
  }
  .form-row input,
  .form-row textarea {
    width: 100%;
    padding: 13px 14px;          /* taller for comfortable touch */
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--bright);
    font-size: 16px;             /* 16px prevents iOS auto-zoom */
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    direction: inherit;
    -webkit-appearance: none;    /* remove iOS default styling */
    appearance: none;
  }
  .form-row input:focus,
  .form-row textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(159,239,0,0.08);
  }
  .form-row textarea {
    resize: vertical;
    min-height: 88px;
  }

  .btn {
    width: 100%;
    padding: 15px 13px;          /* taller touch target */
    min-height: 48px;
    background: var(--green);
    color: #141D2B;
    border: none;
    border-radius: 3px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.18s, box-shadow 0.18s, transform 0.15s;
    box-shadow: 0 0 20px rgba(159,239,0,0.2);
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
  }
  @media (hover: hover) {
    /* hover effects only for devices that truly support hover (not touch) */
    .btn:hover {
      background: var(--green2);
      box-shadow: 0 0 30px rgba(159,239,0,0.35);
      transform: translateY(-1px);
    }
    .contact a:hover { color: var(--green); }
    .lang-pill:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(159,239,0,0.06);
    }
  }
  .btn:active { transform: translateY(0); background: var(--green2); }

  .contact {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;      /* stack vertically by default for mobile */
    align-items: center;
    gap: 14px;
  }
  .contact a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color 0.2s;
    letter-spacing: 0.5px;
    padding: 6px 0;              /* extra vertical tap area */
    min-height: 44px;
    touch-action: manipulation;
  }

  .wa-icon {
    width: 20px; height: 20px;
    fill: #25D366;
    flex-shrink: 0;
  }
  .mail-icon { font-size: 18px; }

  .success {
    display: none;
    text-align: center;
    padding: 24px;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* Scanline flicker on h1 — subtle HTB feel */
  @keyframes flicker {
    0%,100% { opacity:1; } 92% { opacity:1; } 93% { opacity:0.85; } 94% { opacity:1; }
  }
  h1 { animation: flicker 6s infinite; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }

  /* ── Tablet & up: restore side-by-side contact links ── */
  @media (min-width: 480px) {
    body { padding: 80px 24px 32px; }
    .card { padding: 52px 48px; }
    .contact {
      flex-direction: row;
      justify-content: center;
      gap: 28px;
    }
  }

  /* ── Desktop: restore original generous padding ── */
  @media (min-width: 700px) {
    body { padding: 60px 24px; }
  }

  /* ── Very small phones (< 360px) ── */
  @media (max-width: 359px) {
    .card { padding: 28px 16px; }
    .ornament-line::before,
    .ornament-line::after { display: none; }
    .lang-pill { width: 38px; height: 32px; font-size: 10px; }
  }
</style>
</head>

<script>
const i18n = {
  en: {
    tagline:   "Contact Us — Buy This Domain Today",
    badge:     "For Sale",
    desc:      "We sell domains with fast response and outstanding service — open to businesses of all sizes and types. Same-day transfer guaranteed. We're open to negotiations.",
    priceLabel:"Asking Price",

    phOffer:   "e.g. USD 8,000",
    phMsg:     "Tell us about your project...",
    submitBtn: "Submit Offer →",

    dir:       "ltr"
  },
  fr: {
    tagline:   "Contactez-nous — Achetez ce domaine aujourd'hui",
    badge:     "À Vendre",
    desc:      "Nous vendons des domaines avec une réponse rapide et un service exceptionnel — ouverts aux entreprises de toutes tailles. Transfert le jour même garanti. Nous sommes ouverts à la négociation.",
    priceLabel:"Prix demandé",
    fieldName: "Votre nom",

    fieldOffer:"Votre offre (optionnel)",
    fieldMsg:  "Message (optionnel)",
    phName:    "Ahmed Benali",
    phEmail:   "ahmed@entreprise.ma",
    phPhone:   "+212 6XX XXX XXX",

    phMsg:     "Parlez-nous de votre projet...",
    submitBtn: "Soumettre une offre →",
    successMsg:"✓ Votre offre a été reçue. Nous vous contacterons bientôt.",
    dir:       "ltr"
  },
  ar: {
    tagline:   "تواصل معنا — اشترِ هذا النطاق اليوم",
    badge:     "للبيع",
    desc:      "نبيع النطاقات باستجابة سريعة وخدمة متميزة — مفتوحون للشركات من جميع الأحجام والأنواع. نضمن نقل الملكية في نفس اليوم. ونرحب بالتفاوض.",
    priceLabel:"السعر المطلوب",
    fieldName: "الاسم الكامل",
    fieldEmail:"البريد الإلكتروني",
    fieldPhone:"رقم الهاتف",
    fieldOffer:"عرضك (اختياري)",
    fieldMsg:  "رسالة (اختياري)",
    phName:    "أحمد بنعلي",
    phEmail:   "ahmed@company.ma",

    phOffer:   "مثال: 8,000 درهم",
    phMsg:     "أخبرنا عن مشروعك...",
    submitBtn: "إرسال العرض ←",
    successMsg:"✓ تم استلام عرضك. سنتواصل معك قريباً.",
    dir:       "rtl"
  },
  es: {
    tagline:   "Contáctenos — Compre este dominio hoy",
    badge:     "En Venta",
    desc:      "Vendemos dominios con respuesta rápida y un servicio excelente — abiertos a empresas de todos los tamaños y tipos. Transferencia el mismo día garantizada. Estamos abiertos a negociar.",
    priceLabel:"Precio pedido",
    fieldName: "Su nombre",
    fieldEmail:"Correo electrónico",
    fieldPhone:"Número de teléfono",
    fieldOffer:"Su oferta (opcional)",
    fieldMsg:  "Mensaje (opcional)",
    phName:    "Ahmed Benali",
    phEmail:   "ahmed@empresa.ma",
    phPhone:   "+212 6XX XXX XXX",
    phOffer:   "ej. EUR 8.000",
    phMsg:     "Cuéntenos sobre su proyecto...",
    submitBtn: "Enviar oferta →",
    successMsg:"✓ Su oferta ha sido recibida. Nos pondremos en contacto pronto.",
    dir:       "ltr"
  }
};

function setLang(code) {
  const t = i18n[code];
  const html = document.documentElement;

  // Direction & lang attr
  html.lang = code;
  html.dir  = t.dir;
  document.body.dir = t.dir;

  // Translate all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // Translate placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  // Update active pill
  document.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById('pill-' + code);
  if (pill) pill.classList.add('active');

  localStorage.setItem('preferredLang', code);
}

function detectLang() {
  // 1. Respect a previously saved manual choice
  const saved = localStorage.getItem('preferredLang');
  if (saved && i18n[saved]) return saved;

  // 2. Walk browser language preferences and pick the first match
  const langs = navigator.languages || [navigator.language || 'en'];
  for (const l of langs) {
    const code = l.split('-')[0].toLowerCase(); // e.g. "fr-FR" → "fr"
    if (i18n[code]) return code;
  }

  // 3. Default to English
  return 'en';
}

window.addEventListener('DOMContentLoaded', () => {
  setLang(detectLang());
});

// Form submission
const form = document.getElementById('offerForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('.btn');
  const origText = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      form.reset();
      document.getElementById('successMsg').style.display = 'block';
      btn.style.display = 'none';
    } else {
      btn.textContent = origText;
      btn.disabled = false;
    }
  } catch {
    btn.textContent = origText;
    btn.disabled = false;
  }
});
</script>
