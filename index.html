<style>
  :root {
    --orange:   #FF6B00;
    --orange2:  #E05A00;
    --red:      #C0392B;
    --bg:       #0F0F0F;
    --surface:  #181818;
    --surface2: #1F1F1F;
    --border:   #2C2C2C;
    --text:     #B0ADA8;

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 16px 28px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;

  body[dir="rtl"] { font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* Carbon-weave texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 8px
      ),
      repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 8px
      );
    pointer-events: none;
    z-index: 0;
  }

  /* Orange glow top-left, red ember bottom-right */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 45% at 0% 0%,    rgba(255,107,0,0.09) 0%, transparent 60%),

  .lang-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: calc(100vw - 24px);

    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    width: 44px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Barlow Condensed', sans-serif;
    text-transform: uppercase;
    clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
    touch-action: manipulation;
  }
  .lang-pill.active {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(255,107,0,0.07);
  }

    z-index: 1;

    animation: fadeDown 0.6s ease both;
    padding: 0 8px;

  .ornament-line {

    color: var(--orange);

    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    opacity: 0.9;
    word-break: break-word;
    text-align: center;
  }
  .ornament-line::before,
  .ornament-line::after {

    width: 28px; height: 1px;
    flex-shrink: 0;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);

  .badge {

    font-size: 11px;

    border-radius: 1px;

  /* Bottom-right accent */

function setLang(code) {
  const t = i18n[code];
  const html = document.documentElement;

  html.lang = code;
  html.dir  = t.dir;
  document.body.dir = t.dir;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  document.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById('pill-' + code);
  if (pill) pill.classList.add('active');

  localStorage.setItem('preferredLang', code);
}

function detectLang() {
  const saved = localStorage.getItem('preferredLang');
  if (saved && i18n[saved]) return saved;

  const langs = navigator.languages || [navigator.language || 'en'];
  for (const l of langs) {
    const code = l.split('-')[0].toLowerCase();
    if (i18n[code]) return code;
  }
  return 'en';
}

window.addEventListener('DOMContentLoaded', () => {
  setLang(detectLang());

      method:  'POST',
      body:    new FormData(form),
      headers: { 'Accept': 'application/json' }
    });

    if (res.ok) {
      form.reset();
      // Hide the button, show the success banner
      btnEl.style.display = 'none';
      msgEl.style.display = 'block';
      // Smooth scroll to success message on mobile
      msgEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      // Server returned an error — restore button
      btnEl.textContent = origText;
      btnEl.disabled = false;
      alert('Something went wrong. Please try again.');
    }
  } catch {
    // Network error — restore button
    btnEl.textContent = origText;
    btnEl.disabled = false;
    alert('Network error. Please check your connection and try again.');
  }
});
</script>
</body>
</html>
